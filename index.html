<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#060608" />
    <link rel="icon" type="image/svg+xml" href="/app_icon.svg" />
    <link rel="apple-touch-icon" href="/app_icon.svg" />
    <title>Wallet</title>

    <!-- Telegram does not inject window.Telegram.WebApp on its own — this
         script is what defines it, bridging to the native client's version,
         platform, initData, HapticFeedback, BiometricManager, etc. Without
         it @twa-dev/sdk falls back to its browser stand-in, which is why
         those fields silently read as unavailable/undefined even when the
         page is genuinely opened inside Telegram. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Typography is a system font stack (see tokens.css) — SF Pro on
         iOS/macOS, Helvetica Neue where installed, native fallback elsewhere.
         No webfont files to load, so no <link> here. -->
  </head>
  <body data-theme="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
